
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON JUKEBOX | Listening Party</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Press+Start+2P&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: white;
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  background:
    radial-gradient(ellipse at center, #321052 0%, #100b27 55%, #080817 100%);
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(#ff36d31a 1px, transparent 1px),
    linear-gradient(90deg, #ff36d31a 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: linear-gradient(transparent, black);
}

header {
  padding: 35px 15px 10px;
}

h1 {
  font-family: 'Press Start 2P', cursive;
  font-size: clamp(20px, 5vw, 38px);
  color: #ff55d8;
  text-shadow: 0 0 10px #ff00c8, 0 0 30px #ff00c8;
}

.subtitle {
  color: #58faff;
  letter-spacing: 4px;
  font-size: 11px;
}

.party {
  margin: 20px auto;
  color: #bffcff;
  font-size: 12px;
}

.status {
  color: #61ffba;
}

main {
  padding: 10px 15px 50px;
}

/* JUKEBOX */

.jukebox {
  position: relative;
  width: min(330px, 90vw);
  margin: 30px auto;
  padding: 20px;
  border-radius: 150px 150px 25px 25px;
  background: linear-gradient(135deg, #ff70c9, #8424c9 55%, #29115b);
  border: 5px solid #ffb6ef;
  box-shadow:
    0 0 15px #ff32d0,
    0 0 40px #a000ff,
    inset 0 0 20px #ffc1f0;
  animation: glow 3s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 15px #ff32d0, 0 0 30px #a000ff; }
  to { box-shadow: 0 0 25px #00faff, 0 0 60px #ff32d0; }
}

.jukebox-top {
  padding: 30px 5px 15px;
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  color: #fff;
  text-shadow: 0 0 12px #00ffff;
}

.jukebox-screen {
  padding: 25px 10px;
  border-radius: 15px;
  background: #100c25;
  border: 3px solid #64ffff;
  box-shadow: inset 0 0 20px #00cfff;
}

.disc {
  width: 105px;
  height: 105px;
  margin: auto;
  border-radius: 50%;
  background: repeating-radial-gradient(
    circle, #171717 0 4px, #39304d 5px 7px
  );
  border: 5px solid #ff66cf;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px #ff00cc;
}

.disc::after {
  content: "♫";
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #ff62c9;
  color: white;
}

.spinning {
  animation: spin 3s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.speaker {
  display: flex;
  justify-content: space-around;
  padding: 15px 0;
}

.speaker span {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  border: 4px solid #62faff;
  background: #1b1043;
  box-shadow: 0 0 12px #00eaff;
}

.equalizer {
  display: flex;
  justify-content: center;
  gap: 5px;
  height: 35px;
  align-items: center;
}

.equalizer span {
  width: 5px;
  height: 10px;
  background: #61ffff;
  box-shadow: 0 0 8px #00ffff;
  animation: bounce .5s infinite alternate;
}

.equalizer span:nth-child(2n) {
  animation-delay: .2s;
}
.equalizer span:nth-child(3n) {
  animation-delay: .4s;
}

@keyframes bounce {
  to { height: 32px; }
}

/* PLAYER */

.now-playing {
  color: #ff75d8;
  font-size: 10px;
  letter-spacing: 2px;
}

#songTitle {
  font-size: 13px;
  margin: 12px 0;
  color: #ffffff;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px;
}

button {
  cursor: pointer;
  border: 1px solid #61ffff;
  color: white;
  background: #25114a;
  border-radius: 30px;
  padding: 12px 18px;
  font-family: 'Orbitron', sans-serif;
  box-shadow: 0 0 10px #00eaff;
  transition: .2s;
}

button:hover {
  background: #ff35bf;
  box-shadow: 0 0 20px #ff35bf;
  transform: scale(1.05);
}

.play {
  background: #ff35bf;
  font-size: 20px;
}

input[type="file"] {
  display: none;
}

.upload {
  display: inline-block;
  padding: 12px 20px;
  border-radius: 30px;
  color: white;
  background: #6b26b8;
  border: 1px solid #ff65db;
  cursor: pointer;
  font-size: 11px;
  margin: 10px;
}

.queue {
  max-width: 430px;
  margin: 35px auto;
  padding: 20px;
  background: #17102fdd;
  border: 1px solid #9d49ff;
  border-radius: 15px;
  box-shadow: 0 0 20px #7b22ff55;
}

.queue h2 {
  color: #62faff;
  font-size: 14px;
}

#playlist {
  list-style: none;
  padding: 0;
}

#playlist li {
  padding: 12px;
  border-bottom: 1px solid #ffffff22;
  color: #e9d5ff;
  font-size: 11px;
  cursor: pointer;
}

#playlist li:hover {
  color: #ff69d4;
}

footer {
  color: #a58bbd;
  padding: 20px;
  font-size: 10px;
  letter-spacing: 2px;
}

</style>
</head>

<body>

<header>
  <h1>NEON JUKEBOX</h1>
  <p class="subtitle">✦ YOUR MUSIC. YOUR NIGHT. YOUR PARTY. ✦</p>
</header>

<div class="party">
  <p>🪩 THE LISTENING ROOM 🪩</p>
  <p class="status">● THE PARTY IS OPEN</p>
</div>

<main>

  <div class="jukebox">

    <div class="jukebox-top">
      ★ JUKEBOX ★
    </div>

    <div class="jukebox-screen">

      <div class="disc" id="disc"></div>

      <p class="now-playing">NOW PLAYING</p>
      <p id="songTitle">Choose your first song ♫</p>

      <div class="equalizer">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

    </div>

    <div class="speaker">
      <span></span><span></span><span></span>
    </div>

  </div>

  <div class="controls">
    <button onclick="previousSong()">⏮</button>
    <button class="play" onclick="togglePlay()" id="playBtn">▶</button>
    <button onclick="nextSong()">⏭</button>
  </div>

  <audio id="audio"></audio>

  <label class="upload">
    ＋ ADD YOUR MUSIC
    <input type="file" id="fileInput" accept="audio/*" multiple>
  </label>

  <section class="queue">
    <h2>💿 THE PLAYLIST</h2>
    <ul id="playlist">
      <li>Your songs will appear here...</li>
    </ul>
  </section>

</main>

<footer>
  MADE FOR MUSIC LOVERS ♡ EST. 1985
</footer>

<script>

const audio = document.getElementById("audio");
const disc = document.getElementById("disc");
const playBtn = document.getElementById("playBtn");
const songTitle = document.getElementById("songTitle");
const playlist = document.getElementById("playlist");
const fileInput = document.getElementById("fileInput");

let songs = [];
let currentSong = 0;

fileInput.addEventListener("change", function() {
  const files = Array.from(this.files);

  files.forEach(file => {
    songs.push({
      name: file.name.replace(/\.[^/.]+$/, ""),
      url: URL.createObjectURL(file)
    });
  });

  renderPlaylist();

  if (songs.length > 0 && audio.paused) {
    if (currentSong >= songs.length) currentSong = 0;
    loadSong(currentSong);
  }

  this.value = "";
});

function renderPlaylist() {
  playlist.innerHTML = "";

  songs.forEach((song, index) => {
    const li = document.createElement("li");
    li.textContent = (index + 1) + ". ♫ " + song.name;

    li.onclick = () => {
      currentSong = index;
      loadSong(currentSong);
      playSong();
    };

    playlist.appendChild(li);
  });
}

function loadSong(index) {
  if (!songs[index]) return;

  audio.src = songs[index].url;
  songTitle.textContent = songs[index].name;
  updatePlaylist();
}

function updatePlaylist() {
  Array.from(playlist.children).forEach((item, index) => {
    item.style.color =
      index === currentSong ? "#ff62d5" : "#e9d5ff";
  });
}

function playSong() {
  if (!songs.length) return;

  audio.play().then(() => {
    playBtn.textContent = "❚❚";
    disc.classList.add("spinning");
  }).catch(() => {});
}

function togglePlay() {
  if (!songs.length) {
    alert("Add some music first! ♫");
    return;
  }

  if (audio.paused) {
    playSong();
  } else {
    audio.pause();
    playBtn.textContent = "▶";
    disc.classList.remove("spinning");
  }
}

function nextSong() {
  if (!songs.length) return;
  currentSong = (currentSong + 1) % songs.length;
  loadSong(currentSong);
  playSong();
}

function previousSong() {
  if (!songs.length) return;
  currentSong = (currentSong - 1 + songs.length) % songs.length;
  loadSong(currentSong);
  playSong();
}

audio.addEventListener("ended", nextSong);

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
  disc.classList.remove("spinning");
});

</script>

</body>
</html>
